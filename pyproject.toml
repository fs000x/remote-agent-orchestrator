[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rao"
version = "0.5.0"
description = "Remote Agent Orchestrator - dispatch goals to semi-autonomous agents on remote devices (MCP server for ZCode/Claude/Codex)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "momo" }]
dependencies = [
    "paramiko>=3.4",
    "mcp<2",
    "cryptography>=42",
]

[project.optional-dependencies]
keyring = ["keyring>=5"]
dev = ["pytest>=8", "pytest-asyncio"]

[project.scripts]
rao = "rao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rao = [
    "runtime/*.py",
    "data/skills/**/*.md",
]
